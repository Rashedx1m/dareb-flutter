name: educational_app
description: تطبيق درب التعليمي
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  get_it: ^8.2.0
  go_router: ^16.2.4
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  percent_indicator: ^4.2.5
  shared_preferences: ^2.5.5
  dio: ^5.11.1
  image_picker: ^1.2.3
  url_launcher: ^6.3.3
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# أيقونة التطبيق (شعار درب). لإعادة التوليد بعد أي تعديل على الصور:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#34BBBD"
  adaptive_icon_foreground: "assets/launcher/app_icon_fg.png"
  windows:
    generate: true
    image_path: "assets/launcher/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/images/gallery/
  fonts:
    # الخط العربي الأساسي المستخرج من تصميم فيجما (Typography/Noto Sans Arabic).
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    # خط الأرقام والأحرف اللاتينية (Lato) كما في لوحة Typography بالتصميم.
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lato-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    # خط أيقونات Phosphor الرسمي (بديل حزمة phosphor_flutter غير المتوافقة).
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
